# A service config, in the shape a real one takes.
name = "checkout-api"
version = "2.4.1"
debug = false

[server]
host = "0.0.0.0"
port = 8080
timeout_ms = 30_000

[database]
url = "postgres://localhost/checkout"
pool = { min = 2, max = 16 }

[[route]]
path = "/health"
methods = ["GET"]

[[route]]
path = "/orders"
methods = ["GET", "POST"]
